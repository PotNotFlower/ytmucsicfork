name: Build YTMusik APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install NDK and CMake
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null

      - name: Build debug APK
        run: set -o pipefail; ./gradlew assembleCoreDebug --stacktrace -DskipFormatKtlint --console=plain 2>&1 | tee build.log

      - name: Show failure tail
        if: failure()
        run: |
          { awk '/\* What went wrong:/{f=1} f{print} /^\* Try:/{exit}' build.log; grep -m 20 -E "^e: |error: |FAILED" build.log; } | tr '\n' '|' | head -c 8000 > msg.txt
          echo "::error title=build-tail::$(cat msg.txt)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ytmusik-apk
          path: app/build/outputs/apk/core/debug/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/core/debug/*.apk
