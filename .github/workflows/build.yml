name: Build YTMusik APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Build debug APK and run jvm tests
        run: set -o pipefail; ./gradlew assembleCoreDebug lintCoreDebug testCoreDebugUnitTest --stacktrace -DskipFormatKtlint --console=plain 2>&1 | tee build.log

      - name: Show failure tail
        if: failure()
        run: echo "::error title=build-tail::$(tail -c 4000 build.log | tr '\n' '|')"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ytmusik-apk
          path: app/build/outputs/apk/core/debug/*.apk
